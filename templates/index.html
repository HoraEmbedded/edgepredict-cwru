<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EdgePredict-CWRU Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --ok: #22c55e;
            --fault: #ef4444;
            --warn: #f59e0b;
            --info: #3b82f6;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --ok: #16a34a;
            --fault: #dc2626;
            --warn: #d97706;
            --info: #2563eb;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: background 0.2s, color 0.2s;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        h1 { font-size: 22px; margin-bottom: 4px; }
        .subtitle { color: var(--muted); font-size: 13px; }

        .theme-toggle {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--panel);
            border-radius: 8px;
            padding: 14px 18px;
            min-width: 160px;
            flex: 1;
            border: 1px solid var(--border);
        }
        .card .label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 6px;
        }
        .status-normal { color: var(--ok); }
        .status-fault { color: var(--fault); }

        .controls {
            background: var(--panel);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }
        .controls label {
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .controls select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
        }
        .controls button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .controls button:hover { background: var(--accent-hover); }
        .controls .status {
            font-size: 13px;
            color: var(--muted);
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: var(--panel);
            border-radius: 8px;
            padding: 12px;
            height: 320px;
            border: 1px solid var(--border);
        }

        .meta {
            background: var(--panel);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 13px;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .meta span { color: var(--text); font-weight: bold; }

        @media (max-width: 800px) {
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div>
            <h1>EdgePredict-CWRU</h1>
            <div class="subtitle">Embedded predictive maintenance - Raspberry Pi 4</div>
        </div>
        <button class="theme-toggle" id="theme-toggle">Light mode</button>
    </div>

    <div class="controls">
        <label for="file-select">Scenario</label>
        <select id="file-select"></select>
        <button id="apply-btn">Apply</button>
        <span class="status" id="apply-status"></span>
    </div>

    <div class="cards">
        <div class="card">
            <div class="label">Predicted state</div>
            <div class="value" id="label">-</div>
        </div>
        <div class="card">
            <div class="label">Confidence</div>
            <div class="value" id="confidence">-</div>
        </div>
        <div class="card">
            <div class="label">Latency</div>
            <div class="value" id="latency">-</div>
        </div>
        <div class="card">
            <div class="label">Window index</div>
            <div class="value" id="window">-</div>
        </div>
        <div class="card">
            <div class="label">Source file</div>
            <div class="value" id="source">-</div>
        </div>
    </div>

    <div class="charts">
        <div class="chart-box">
            <canvas id="classChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="featureChart"></canvas>
        </div>
    </div>

    <div class="meta" id="meta">
        Model: <span id="model-classes">-</span> |
        Test accuracy: <span id="model-acc">-</span> |
        Best params: <span id="model-params">-</span>
    </div>

    <script>
        function getCssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('edgepredict-theme', theme);
            const btn = document.getElementById('theme-toggle');
            btn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
            updateChartsTheme();
        }

        function updateChartsTheme() {
            const text = getCssVar('--text');
            const muted = getCssVar('--muted');
            const border = getCssVar('--border');

            [classChart, featureChart].forEach(c => {
                if (!c) return;
                c.options.plugins.title.color = text;
                c.options.plugins.legend.labels.color = text;
                if (c.options.scales) {
                    Object.values(c.options.scales).forEach(s => {
                        if (s.ticks) s.ticks.color = muted;
                        if (s.grid) s.grid.color = border;
                    });
                }
                c.update();
            });
        }

        const classChart = new Chart(document.getElementById('classChart'), {
            type: 'doughnut',
            data: {
                labels: ['Normal', 'InnerRace', 'OuterRace', 'Ball'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#22c55e', '#ef4444', '#f59e0b', '#3b82f6']
                }]
            },
            options: {
                plugins: {
                    title: { display: true, text: 'Class distribution (last 100 windows)' },
                    legend: { labels: {} }
                }
            }
        });

        const featureChart = new Chart(document.getElementById('featureChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'RMS', data: [], borderColor: '#3b82f6', tension: 0.3 },
                    { label: 'Crest Factor', data: [], borderColor: '#f59e0b', tension: 0.3 },
                    { label: 'Kurtosis', data: [], borderColor: '#ef4444', tension: 0.3 },
                    { label: 'Skewness', data: [], borderColor: '#22c55e', tension: 0.3 }
                ]
            },
            options: {
                plugins: {
                    title: { display: true, text: 'Features over time' },
                    legend: { labels: {} }
                },
                scales: {
                    x: { ticks: {}, grid: {} },
                    y: { ticks: {}, grid: {} }
                }
            }
        });

        function updateCards(state) {
            const labelEl = document.getElementById('label');
            labelEl.textContent = state.label || '-';
            labelEl.className = 'value ' + (state.label === 'Normal' ? 'status-normal' : 'status-fault');

            document.getElementById('confidence').textContent =
                state.confidence ? (state.confidence * 100).toFixed(1) + ' %' : '-';
            document.getElementById('latency').textContent =
                state.latency_ms ? state.latency_ms.toFixed(2) + ' ms' : '-';
            document.getElementById('window').textContent =
                state.window_index ?? '-';
            document.getElementById('source').textContent =
                state.source_file || '-';
        }

        function updateClassChart(history) {
            const counts = { Normal: 0, InnerRace: 0, OuterRace: 0, Ball: 0 };
            history.forEach(h => {
                if (counts[h.label] !== undefined) counts[h.label]++;
            });
            classChart.data.datasets[0].data = [
                counts.Normal, counts.InnerRace, counts.OuterRace, counts.Ball
            ];
            classChart.update();
        }

        function updateFeatureChart(history) {
            const last = history.slice(-50);
            featureChart.data.labels = last.map((_, i) => i);
            featureChart.data.datasets[0].data = last.map(h => h.features?.rms ?? 0);
            featureChart.data.datasets[1].data = last.map(h => h.features?.crest_factor ?? 0);
            featureChart.data.datasets[2].data = last.map(h => h.features?.kurtosis ?? 0);
            featureChart.data.datasets[3].data = last.map(h => h.features?.skewness ?? 0);
            featureChart.update();
        }

        async function loadFiles() {
            try {
                const data = await (await fetch('/api/files')).json();
                const select = document.getElementById('file-select');
                select.innerHTML = '';
                data.files.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    if (f === data.current) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (e) { console.error(e); }
        }

        async function applyFile() {
            const select = document.getElementById('file-select');
            const status = document.getElementById('apply-status');
            const file = select.value;
            status.textContent = 'Applying...';
            try {
                const r = await fetch('/api/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file })
                });
                const data = await r.json();
                if (data.ok) {
                    status.textContent = 'Switched to ' + file;
                    setTimeout(() => status.textContent = '', 3000);
                } else {
                    status.textContent = 'Error: ' + (data.error || 'unknown');
                }
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
            }
        }

        async function updateMeta() {
            try {
                const m = await (await fetch('/api/model')).json();
                if (m.classes) {
                    document.getElementById('model-classes').textContent = m.classes.join(', ');
                }
                if (m.test_accuracy !== undefined) {
                    document.getElementById('model-acc').textContent = (m.test_accuracy * 100).toFixed(2) + ' %';
                }
                if (m.best_params) {
                    const p = m.best_params;
                    document.getElementById('model-params').textContent =
                        `n=${p.n_estimators}, depth=${p.max_depth}`;
                }
            } catch (e) { /* ignore */ }
        }

        async function refresh() {
            try {
                const s = await (await fetch('/api/state')).json();
                updateCards(s);
                const h = await (await fetch('/api/history')).json();
                updateClassChart(h);
                updateFeatureChart(h);
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('apply-btn').addEventListener('click', applyFile);
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        const savedTheme = localStorage.getItem('edgepredict-theme') || 'dark';
        applyTheme(savedTheme);

        setInterval(refresh, 1000);
        loadFiles();
        updateMeta();
        refresh();
    </script>
</body>
</html>
